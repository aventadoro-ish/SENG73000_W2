<!DOCTYPE html>
<html>

    <body id="page_top">
        <aside><iframe src="links.html" title="Navigation"></iframe></aside>

        <h1>User Login Form</h1>

        <form action="../php/login.php" method="POST" id="login">
            <p>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>

            <input id="submit_btn" type="submit" value="Log in">
        </form>

        <p>
            If you do not have an account, use the
            <a href="request_access.html">Request Access</a> form to register.
        </p>

        <footer>
            <p><a href="#page_top">Go to the top of this page</a></p>

        </footer>
