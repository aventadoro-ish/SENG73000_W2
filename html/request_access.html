<!DOCTYPE html>
<html>
    <head>
        <title>Access Request Form</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="../css/logbook_person.css">
		<link rel="stylesheet" href="../css/master.css">
		<link rel="icon" href="../media/icons/LiF_icon.ico" type="image/x-icon">
		
		<!--[if lt IE 9]>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
		<![endif]-->
		
		<meta name="author" content="Matvey Regentov">
		<meta name="description" content="Request access to hidden contents of the website.">
		<meta name="robots" content="index, follow">
		<meta http-equiv="Pragma" content="no-cache">
    </head>
    <body id="page_top">
        <aside><iframe src="links.html" title="Navigation"></iframe></aside>
        <h1>Request Access</h1>
        <form action="../php/request_access.php" method="post">
            <fieldset>  <!--Adds a boundary, encapsulating elements-->
                <legend>Contact Info</legend>
                <p>First Name: <input type="text" name="firstName"/></p>
                <p>Last Name: <input type="text" name="lastName"/></p>
                <p>Email: <input type="email" name="email" required></p>
                
                <legend>Occupation</legend>
                <!--radio elements with matching names are selected exclusively-->
                <label><input type="radio" name="fac_or_student" value="faculty"/>Faculty <br></label>
                <label><input type="radio" name="fac_or_student" value="student"/>Student <br></label>

                <p>
                    Birthday:
                    <input type="date" name="birthday" required>
                </p>


                <p>Currently, I am ... (select all that applies)</p>
                <!--Label allows to click text and still select the checkbox-->
                <label><input type="checkbox" name="involvement[]" value="None"/>Nobody</label><br>
                <label><input type="checkbox" name="involvement[]" value="Instructor"/> Instructor </label><br>
                <label><input type="checkbox" name="involvement[]" value="Boss"/> Boss </label><br>
                <label><input type="checkbox" name="involvement[]" value="Investor"/> Investor </label><br>

                <p>Do you drive a car?
                    <select name="drives_car">
                        <option value="no_answer" selected>Prefer not to say</option>
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </p>
            
            </fieldset>

            <p>Tell us about yourself</p>
            <textarea name="details" placeholder="Other details"></textarea>

            <input type="submit" value="Submit Request"/>
        </form>
    
        <footer>
            <p><a href="#page_top">Go to the top of this page</a></p>
            <p>Copyright &copy; 2026 Matvey Regentov</p>
        </footer>
    </body>
</html>
